<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví điện tử & Đăng Nhập</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/0.10.0/forge.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class = "container-login">

        <!--Tạo Ví Waller-->
        <div class = "box">
            <h2 style= "color: #e67e22;">Tạo Wallet (Web3)</h2>
            <p style="font-size: 13px; color: gray;">Hệ thống sẽ tự sinh Cặp khóa RSA. Backend chỉ lưu Khóa Công Khai (Public Key)</p>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Tên định danh (VD: user1)" required>
                <button type="submit" class="btn-register" id="regBtn">Tạo Ví & Sinh Khóa RSA</button>
                <div id="regMessage" class="message"></div>
            </form>
        </div>

        <!--Tạo Ví Waller-->
        <div class="box">
            <h2 style="color: #28a745;">Đăng nhập hệ thống</h2>
            <p style="font-size: 13px; color: gray;">Dành cho Chủ thầu (Admin) hoặc Nhà thầu đã có Ví trên trình duyệt này</p>
            <form id="loginForm">
                <input type="text" id="logUsername" placeholder="Tên đăng nhập" required>
                <input type="password" id="logPassword" placeholder="Mật khẩu (Chỉ Admin cần nhập)">
                <button type="submit" class="btn-login">Đăng Nhập</button>
                <div id="logMessage" class="message" style="color: red;"></div>
            </form>

        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
